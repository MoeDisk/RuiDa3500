<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1915">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>锐达3500</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="app">
    <nav id="tabs"></nav>
    <div class="workspace">
      <header id="top"></header>
      <main id="view"></main>
    </div>
  </div>
  <div id="toast" role="status"></div>
  <div id="notice" role="status"></div>
  <div id="sheet" class="hidden"></div>
  <div id="scan" class="scan hidden">
    <video id="scanVideo" playsinline webkit-playsinline autoplay muted></video>
    <div class="scan-mask"></div>
    <p id="scanHint" class="scan-hint"></p>
    <div class="scan-actions">
      <button type="button" id="scanShot" class="scan-close">拍照识别</button>
      <button type="button" id="scanClose" class="scan-close quiet">关闭</button>
    </div>
  </div>
  <input id="scanFile" class="scan-file" type="file" accept="image/*" capture="environment">
  <script src="/vendor/qrcode.min.js"></script>
  <script src="/vendor/jsQR.js"></script>
  <script src="/i18n.js"></script>
  <script src="/app.js"></script>
</body>
</html>
